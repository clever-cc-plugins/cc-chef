name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-24.04  # Python 3.9 has no build for newer images
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Recipe tool
        run: python3 -m unittest discover -s tests/recipe-tool -v
      - name: Tandoor scripts (fake server)
        run: python3 -m unittest discover -s tests/tandoor -v
